services:
  emulatorjs:
    container_name: emulatorjs
    build:
      context: .
      args:
        EMULATORJS_VERSION: 4.2.3
    image: emulatorjs-site:latest
    environment:
      - TZ=Europe/Lisbon
    volumes:
      # One folder per system, named after the EmulatorJS core, e.g. ./data/roms/nes/game.nes
      - ./data/roms:/usr/share/nginx/html/roms:ro
      # Optional BIOS per system, e.g. ./data/bios/psx/scph5501.bin (or a .zip with several)
      - ./data/bios:/usr/share/nginx/html/bios:ro
    ports:
      - "8085:80"
    restart: unless-stopped
