server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript application/json application/wasm text/css;

    # EmulatorJS paths aren't versioned, so make browsers revalidate (cheap 304s via
    # ETag/Last-Modified) rather than mix stale files with a newer release.
    location /emulatorjs/ {
        add_header Cache-Control "no-cache";
    }

    # ROM library, mounted from the host. Listed as JSON so the index page can browse it.
    location /roms/ {
        autoindex on;
        autoindex_format json;
    }

    # Optional BIOS files, one folder per system (e.g. /bios/psx/scph5501.bin)
    location /bios/ {
        autoindex on;
        autoindex_format json;
    }
}
